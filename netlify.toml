# Site statique : la racine du dépôt est publiée telle quelle, sans étape de construction.
[build]
  publish = "."
  command = ""

[build.environment]
  # Playwright ne sert qu'aux tests : pas de téléchargement de navigateur au déploiement.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# La page, ses styles et scripts, et les retours publiés sont toujours revalidés, pour voir tout de suite une mise à jour.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/retours.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
